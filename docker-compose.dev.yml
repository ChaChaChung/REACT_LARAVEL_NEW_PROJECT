services:
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.dev
    container_name: chacha_app
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - ./docker/php/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini #php.ini的設定 避免被攻擊
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/xdebug.custom.ini #xdebug的設定 用不同檔名，避免覆蓋整個 docker-php-ext-xdebug.ini
      - ./.vscode:/var/www/html/.vscode
    ports:
      - "9003:9003" # Xdebug
    #  - "5173:5173"
    networks:
      - laravel
    depends_on:
      - mysql
  nginx:
    image: nginx:stable-alpine
    container_name: chacha_nginx
    restart: unless-stopped
    ports:
      - "8080:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: chacha_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chacha
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata:
