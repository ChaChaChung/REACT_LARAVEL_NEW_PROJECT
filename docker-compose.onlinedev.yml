services:
  app:
    build:
      context: ./backend
      dockerfile: ../docker/php/Dockerfile.prod
    container_name: chacha_app
    restart: unless-stopped
    user: "www-data"
    volumes:
      - ./backend:/var/www/html # 挂载代码目录（开发用）
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini #php.ini的設定 避免被攻擊
      - ./docker/php/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf # Supervisor
      - storage_data:/var/www/html/storage/app # 只挂载 app 目录（上传文件）
    networks:
      - laravel
    depends_on:
      - mysql
  nginx:
    image: nginx:stable-alpine
    container_name: chacha_nginx
    restart: unless-stopped
    ports:
      - "80:80"

    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.onlinedev.conf:/etc/nginx/conf.d/default.conf
      - storage_data:/var/www/html/storage/app # 只挂载 app 目录（上传文件）
    depends_on:
      - app

    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: chacha_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: chacha
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  dbdata:
  storage_data:
